name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pins.nix can only fetch pins via `spin` unless this is set.
  SPIN_FALLBACK: "1"
  GOTOOLCHAIN: local

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Plain unit tests on both architectures, against the minimum Go version from
  # go.mod and the latest stable release.
  # ./tests needs root and a styx-capable kernel; it runs in the suite job.
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        go: [go.mod, stable]
    name: unit (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
      - run: go build ./...
      - run: go test -shuffle=on $(go list ./... | grep -v '/tests$')

  # Unit tests under the race detector and sanitizers. -race, -asan and -msan
  # all imply -d=checkptr. The cgo code (vendored zstd) is instrumented too.
  sanitize:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        mode: [race, asan, msan, ubsan]
    name: sanitize (${{ matrix.mode }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Configure ${{ matrix.mode }}
        run: |
          case "${{ matrix.mode }}" in
            race)  flags="-race" ;;
            asan)  flags="-asan"
                   echo "ASAN_OPTIONS=detect_leaks=1:halt_on_error=1:strict_string_checks=1" >> "$GITHUB_ENV" ;;
            msan)  flags="-msan"
                   echo "CC=clang" >> "$GITHUB_ENV"
                   echo "CXX=clang++" >> "$GITHUB_ENV" ;;
            ubsan) flags=""
                   ubsan="-fsanitize=undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
                   echo "CC=clang" >> "$GITHUB_ENV"
                   echo "CGO_CFLAGS=-O1 -g $ubsan" >> "$GITHUB_ENV"
                   echo "CGO_LDFLAGS=$ubsan" >> "$GITHUB_ENV"
                   echo "UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1" >> "$GITHUB_ENV" ;;
          esac
          echo "SANFLAGS=$flags" >> "$GITHUB_ENV"
          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"
      - run: go vet $SANFLAGS ./...
      - name: go test ${{ matrix.mode }}
        run: go test $SANFLAGS -shuffle=on -count=2 -timeout 20m $(go list ./... | grep -v '/tests$')

  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Build pinned tools
        run: |
          nix-build -o devtools -E 'with import (import ./Pins.nix).nixpkgs {}; buildEnv { name = "styx-ci-tools"; paths = [ go_1_27 nixfmt protobuf protoc-gen-go ]; }'
          echo "$PWD/devtools/bin" >> "$GITHUB_PATH"
      - name: nixfmt
        run: git ls-files -z '*.nix' | xargs -0 nixfmt --check
      - name: go generate (protobuf) is up to date
        run: |
          go generate ./pb/...
          git diff --exit-code -- pb/ || { echo "::error::pb/ is stale; run go generate ./pb/... with the pinned protoc"; exit 1; }

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            attrs: styx-local charon charon-light spin styx-test styx-test-race styx-test-asan styx-lambda-image charon-image
          - os: ubuntu-24.04-arm
            attrs: styx-local charon charon-light spin styx-test styx-test-race styx-test-asan
    name: nix-build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-build-${{ runner.arch }}-${{ hashFiles('**/*.nix', 'Pins.json', 'go.sum') }}
          restore-prefixes-first-match: nix-build-${{ runner.arch }}-
      - name: nix-build
        run: nix-build --no-out-link $(printf -- '-A %s ' ${{ matrix.attrs }})

  # Nix with the styx patch, which the NixOS module installs as nix.package.
  patched-nix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    name: patched-nix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-patched-${{ runner.arch }}-${{ hashFiles('default.nix', 'patches/**', 'Pins.json') }}
          restore-prefixes-first-match: nix-patched-${{ runner.arch }}-
      - name: nix-build patchedNix
        run: nix-build -o patched-nix -A patchedNix
      - name: styx settings are registered
        run: |
          ./patched-nix/bin/nix --version
          for s in styx-substituters styx-min-size styx-ondemand styx-materialize styx-exclude styx-sock-path styx-timeout; do
            printf '%s = ' "$s"; ./patched-nix/bin/nix --extra-experimental-features nix-command config show "$s"
          done
      - name: styx patch behaviour
        run: |
          nix-build -o erofs-utils -E 'with import (import ./Pins.nix).nixpkgs {}; erofs-utils'
          bash .github/nix-patch-contract.sh ./patched-nix/bin ./erofs-utils/bin/mkfs.erofs

  # The full privileged test suite on the host kernel, plain and instrumented.
  # Don't make the race detector halt on error here: the daemon runs in the
  # test process, and exiting while threads wait on its cachefiles reads hangs.
  suite:
    strategy:
      fail-fast: false
      matrix:
        variant: [styx-test, styx-test-race, styx-test-asan]
    name: suite (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check kernel supports styx
        run: |
          kver=$(uname -r)
          echo "kernel $kver"
          missing=
          for opt in CACHEFILES_ONDEMAND EROFS_FS_ONDEMAND; do
            grep -q "^CONFIG_${opt}=y" "/boot/config-$kver" || missing="$missing CONFIG_${opt}"
          done
          if [ -n "$missing" ]; then
            echo "::error::runner kernel $kver lacks$missing; styx tests cannot run on the host"
            exit 1
          fi
          sudo modprobe cachefiles
          sudo modprobe erofs
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-suite-${{ matrix.variant }}-${{ hashFiles('**/*.nix', 'Pins.json', 'go.sum') }}
          restore-prefixes-first-match: nix-suite-${{ matrix.variant }}-
      - name: Build test binary and tools
        run: |
          nix-build -o styxtest -A ${{ matrix.variant }}
          # tools the tests exec from PATH (the VM test gets these from NixOS)
          nix-build -o tools -E 'with import (import ./Pins.nix).nixpkgs {}; buildEnv { name = "styxtest-tools"; paths = [ nix psmisc xz ]; }'
      - name: Run test suite
        working-directory: styxtest/bin
        run: |
          sudo env PATH="$GITHUB_WORKSPACE/tools/bin:$PATH" \
            ASAN_OPTIONS="detect_leaks=1" \
            ./styxtest -test.v -test.timeout 30m
